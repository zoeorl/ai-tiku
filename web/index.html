<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI博主对标选题库</title>
<link rel="stylesheet" href="styles.css?v=20260821f">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>AI博主对标选题库</h1>
        <p class="sub">已验证爆款 · 规律沉淀 · md 单一数据源实时解析</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="library">选题库</button>
      <button class="tab" data-tab="bloggers">博主总览</button>
      <button class="tab" data-tab="boards">跨博主榜单</button>
      <button class="tab" data-tab="rules">跨博主规律</button>
    </nav>
  </div>
</header>

<div class="linkhint">
  <div class="wrap">原笔记链接已附访问凭证，电脑 / 手机点击即可直接打开；个别链接若仍被拦截，属笔记已被删除或设为私密。</div>
</div>

<main class="wrap">

  <!-- 选题库 -->
  <section id="view-library" class="view active">
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索标题 / 标签 / 钩子 / 规律关键词…">
      <div class="bselect" id="bloggerSelect">
        <button class="bselect-btn" id="bloggerBtn" type="button">全部博主 ▾</button>
        <div class="bselect-panel" id="bloggerPanel" hidden>
          <input id="bloggerSearch" type="search" placeholder="搜索博主名…">
          <div class="bselect-list" id="bloggerList"></div>
        </div>
      </div>
      <div class="selects">
        <select id="typeFilter">
          <option value="">全部内容类型</option>
          <option value="教程">教程类</option>
          <option value="案例拆解">案例拆解</option>
          <option value="工具测评">工具测评</option>
          <option value="行业观点">行业观点</option>
          <option value="其他">其他</option>
        </select>
        <select id="formFilter">
          <option value="">全部形式</option>
          <option value="视频">视频</option>
          <option value="图文">图文</option>
        </select>
        <select id="sortSelect">
          <option value="date">发布日 · 新→旧</option>
          <option value="like">点赞 · 高→低</option>
          <option value="fav">收藏 · 高→低</option>
          <option value="favRatio">收藏比 · 高→低</option>
          <option value="comRatio">评论比 · 高→低</option>
          <option value="shareRatio">分享比 · 高→低</option>
        </select>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid" id="grid"></div>
    <button class="loadmore" id="loadMore" hidden></button>
    <div class="empty" id="empty" hidden>没有匹配的条目，换个关键词试试</div>
  </section>

  <!-- 博主总览 -->
  <section id="view-bloggers" class="view">
    <div class="stats" id="bloggerStatsLine"></div>
    <div class="bgrid" id="bloggerGrid"></div>
  </section>

  <!-- 榜单 -->
  <section id="view-boards" class="view">
    <div class="boards" id="boards"></div>
  </section>

  <!-- 规律 -->
  <section id="view-rules" class="view">
    <div class="rules-vis" id="rulesBody"></div>
  </section>

</main>

<footer class="foot wrap">
  数据来源：对标库 md 文件实时解析 · 每次录入后刷新页面即同步
</footer>

<!-- 内容拆解弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-mask" id="modalMask"></div>
  <div class="modal-panel">
    <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="app.js?v=20260821f"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!sessionStorage.getItem("sw-reloaded")) {
      sessionStorage.setItem("sw-reloaded", "1");
      location.reload();
    } else { sessionStorage.removeItem("sw-reloaded"); }
  });
}
</script>
</body>
</html>
